slots:
  id:
    name: id
    definition_uri: https://w3id.org/diatomsRcool/exposome-schema/id
    description: A unique identifier for a thing
    from_schema: https://w3id.org/diatomsRcool/exposome-schema
    mappings:
    - schema:identifier
    slot_uri: schema:identifier
    identifier: true
    owner: NamedThing
    domain_of:
    - NamedThing
    range: uriorcurie
    required: true
  name:
    name: name
    definition_uri: https://w3id.org/diatomsRcool/exposome-schema/name
    description: A human-readable name for a thing
    from_schema: https://w3id.org/diatomsRcool/exposome-schema
    mappings:
    - schema:name
    slot_uri: schema:name
    owner: NamedThing
    domain_of:
    - NamedThing
    range: string
  description:
    name: description
    definition_uri: https://w3id.org/diatomsRcool/exposome-schema/description
    description: A human-readable description for a thing
    from_schema: https://w3id.org/diatomsRcool/exposome-schema
    mappings:
    - schema:description
    slot_uri: schema:description
    owner: NamedThing
    domain_of:
    - NamedThing
    range: string
  category:
    name: category
    definition_uri: https://w3id.org/diatomsRcool/exposome-schema/category
    description: A category or type for a thing
    from_schema: https://w3id.org/diatomsRcool/exposome-schema
    slot_uri: exposome_schema:category
    owner: NamedThing
    domain_of:
    - NamedThing
    range: string
    multivalued: true
  xref:
    name: xref
    definition_uri: https://w3id.org/diatomsRcool/exposome-schema/xref
    description: External database cross-references
    from_schema: https://w3id.org/diatomsRcool/exposome-schema
    slot_uri: exposome_schema:xref
    owner: NamedThing
    domain_of:
    - NamedThing
    range: uriorcurie
    multivalued: true
  chebi_id:
    name: chebi_id
    definition_uri: https://w3id.org/diatomsRcool/exposome-schema/chebi_id
    description: ChEBI identifier
    from_schema: https://w3id.org/diatomsRcool/exposome-schema
    slot_uri: exposome_schema:chebi_id
    owner: ChemicalEntity
    domain_of:
    - ChemicalEntity
    range: uriorcurie
    pattern: ^CHEBI:\d+$
  dtxsid:
    name: dtxsid
    definition_uri: https://w3id.org/diatomsRcool/exposome-schema/dtxsid
    description: EPA CompTox Dashboard identifier
    from_schema: https://w3id.org/diatomsRcool/exposome-schema
    slot_uri: exposome_schema:dtxsid
    owner: ChemicalEntity
    domain_of:
    - ChemicalEntity
    range: string
    pattern: ^DTXSID\d{7,9}$
  chembl_id:
    name: chembl_id
    definition_uri: https://w3id.org/diatomsRcool/exposome-schema/chembl_id
    description: ChEMBL compound identifier
    from_schema: https://w3id.org/diatomsRcool/exposome-schema
    slot_uri: exposome_schema:chembl_id
    owner: ChemicalEntity
    domain_of:
    - ChemicalEntity
    range: string
    pattern: ^CHEMBL\d+$
  pubchem_cid:
    name: pubchem_cid
    definition_uri: https://w3id.org/diatomsRcool/exposome-schema/pubchem_cid
    description: PubChem Compound identifier
    from_schema: https://w3id.org/diatomsRcool/exposome-schema
    slot_uri: exposome_schema:pubchem_cid
    owner: ChemicalEntity
    domain_of:
    - ChemicalEntity
    range: integer
  cas_number:
    name: cas_number
    definition_uri: https://w3id.org/diatomsRcool/exposome-schema/cas_number
    description: CAS Registry Number
    from_schema: https://w3id.org/diatomsRcool/exposome-schema
    slot_uri: exposome_schema:cas_number
    owner: ChemicalEntity
    domain_of:
    - ChemicalEntity
    range: string
  inchi:
    name: inchi
    definition_uri: https://w3id.org/diatomsRcool/exposome-schema/inchi
    description: InChI chemical identifier
    from_schema: https://w3id.org/diatomsRcool/exposome-schema
    slot_uri: exposome_schema:inchi
    owner: ChemicalEntity
    domain_of:
    - ChemicalEntity
    range: string
