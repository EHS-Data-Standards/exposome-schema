name: exposome-schema
description: 'Comprehensive exposome schema for integrating chemical exposures, environmental
  factors,

  dietary data, toxicology databases, and health outcomes with support for Adverse
  Outcome

  Pathways (AOPs) and multi-granularity measurements'
title: exposome-schema
see_also:
- https://diatomsRcool.github.io/exposome-schema
id: https://w3id.org/diatomsRcool/exposome-schema
imports:
- linkml:types
license: MIT
prefixes:
  exposome_schema:
    prefix_prefix: exposome_schema
    prefix_reference: https://w3id.org/diatomsRcool/exposome-schema/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  biolink:
    prefix_prefix: biolink
    prefix_reference: https://w3id.org/biolink/vocab/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  CHEBI:
    prefix_prefix: CHEBI
    prefix_reference: http://purl.obolibrary.org/obo/CHEBI_
  FOODON:
    prefix_prefix: FOODON
    prefix_reference: http://purl.obolibrary.org/obo/FOODON_
  CL:
    prefix_prefix: CL
    prefix_reference: http://purl.obolibrary.org/obo/CL_
  HP:
    prefix_prefix: HP
    prefix_reference: http://purl.obolibrary.org/obo/HP_
  UPHENO:
    prefix_prefix: UPHENO
